name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked project dependencies
        run: python -m venv .venv && make install-lock
      - name: Run unit and API tests
        run: make test
      - name: Run lint and formatting checks
        run: make quality
